# DJ Dvir — public licensing/monitoring hub. Minimal + light deps so it deploys clean on Render free tier.
services:
  - type: web
    name: dj-dvir-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/license_admin.py
    envVars:
      - key: RK_HUB_BIND
        value: "0.0.0.0"
      - key: PYTHON_VERSION
        value: "3.12.6"

# NOTE: set RK_ADMIN_TOKEN as an env var in the Render dashboard (keep it out of this public repo).
